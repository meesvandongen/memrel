packages:
  - apps/*
  - packages/*

catalogMode: prefer

catalog:
  '@changesets/changelog-github': ^1.0.1
  '@changesets/cli': ^3.0.3
  '@types/node': ^26.0.0
  publint: ^0.3.25
  tinybench: ^6.2.2
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@8.3.8000
  vite-plus: 1.7.0

# vite-plus provides `vite` through its own core; point every `vite` at it and accept its 1.x version.
overrides:
  vite@*: 'catalog:'

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: '*'
